<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <title>Terminal Layout</title>
    </head>
    <body style="margin: 0; padding: 0;">

        <div class="container">
            
            <div class="nav">
                guest@benjaminfberger:~$
            </div>

            <div class="wrapper">
                
                <div class="logo">
                    Logo
                </div>
                
                <div class="content">
                    
                    <div class="name">
                        Ben
                        <div class="pronouns">
                            Student                    He/Him
                        </div>
                    </div>
                    
                    <div class="stats">
                        <div class="stat">
                            <div class="label">Name</div>
                            <div class="value"> : Ben</div>
                        </div>
                        <div class="stat">
                            <div class="label">Occupation</div>
                            <div class="value"> : Student</div>
                        </div>
                        <div class="stat">
                            <div class="label">Location</div>
                            <div class="value"> : None of your concern</div>
                        </div>
                        <div class="stat">
                            <div class="label">Interests</div>
                            <div class="value"> : Programming, Gaming, Music</div>
                        </div>
                        <div class="stat">
                            <div class="label">Skills</div>
                            <div class="value"> : C#</div>
                        </div>
                    </div>
                    
                    <div class="links">
                        Links
                    </div>
                    
                    <div class="about">
                        About
                    </div>
                </div>

            </div>

            <div class="footer">
                guest@benjaminfberger:~$
                <span class="cursor">█</span>
            </div>

        </div>

    </body>
</html>
