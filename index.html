<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <title>Terminal Layout</title>
    </head>
    <body style="margin: 0; padding: 0;">

        <div class="container">
            
            <div class="nav">
                guest@benjaminfberger:~$
            </div>

            <div class="wrapper">
                
                <div class="logo">
                    Logo
                </div>
                
                <div class="content">
                    
                    <div class="name text-bright-yellow">
                        Ben
                        <div class="pronouns text-dark-grey">
                            Student                    He/Him
                        </div>
                    </div>
                    
                    <div class="stats">
                        <div class="stat">
                            <div class="label text-dark-grey">Name</div>
                            <div class="colon" text-white>:</div>
                            <div class="value text-bright-white">Ben</div>
                        </div>
                        <div class="stat">
                            <div class="label text-dark-grey">Occupation</div>
                            <div class="colon" text-white>:</div>
                            <div class="value text-bright-white">Student</div>
                        </div>
                        <div class="stat">
                            <div class="label text-dark-grey">Location</div>
                            <div class="colon" text-white>:</div>
                            <div class="value text-bright-white">None of your concern</div>
                        </div>
                        <div class="stat">
                            <div class="label text-dark-grey">Interests</div>
                            <div class="colon" text-white>:</div>
                            <div class="value text-bright-white">Programming, Gaming, Music</div>
                        </div>
                        <div class="stat">
                            <div class="label text-dark-grey">Skills</div>
                            <div class="colon" text-white>:</div>
                            <div class="value text-bright-white">C#</div>
                        </div>
                    </div>
                    
                    <div class="links">
                        Links
                    </div>
                    
                    <div class="about">
                        About
                    </div>
                </div>

            </div>

            <div class="footer">
                guest@benjaminfberger:~$
                <span class="cursor">█</span>
            </div>

        </div>

    </body>
</html>
